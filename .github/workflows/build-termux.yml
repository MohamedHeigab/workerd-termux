name: Build workerd for Termux Android

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      workerd_version:
        description: 'workerd git tag or branch to build (e.g. v1.20250214.0 or main)'
        required: true
        default: 'main'
      build_type:
        description: 'Build configuration (release or opt)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - opt

permissions:
  contents: write

jobs:
  build-termux:
    name: Build workerd (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            android_abi: arm64-v8a
            target_triple: aarch64-linux-android
            api_level: 24
          - arch: x86_64
            android_abi: x86_64
            target_triple: x86_64-linux-android
            api_level: 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Netrc for GitHub API
        run: |
          echo "machine api.github.com login x-access-token password ${{ secrets.GITHUB_TOKEN }}" >> ~/.netrc
          echo "machine github.com login x-access-token password ${{ secrets.GITHUB_TOKEN }}" >> ~/.netrc
          chmod 600 ~/.netrc

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Host Tools and LLVM 19
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout="30" update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout="30" install -y --no-install-recommends \
            build-essential \
            clang-19 \
            lld-19 \
            llvm-19 \
            libc++-19-dev \
            libc++abi-19-dev \
            tcl8.6-dev \
            tcl8.6 \
            ninja-build \
            pkg-config \
            dpkg-dev \
            file \
            binutils
          # Configure default clang to clang-19 and create all required tool symlinks
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 100
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-19 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-19 100
          sudo ln -sf /usr/bin/ld.lld-19 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/lld-19 /usr/bin/lld
          sudo ln -sf /usr/bin/llvm-ar-19 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-ranlib-19 /usr/bin/llvm-ranlib
          sudo ln -sf /usr/bin/llvm-strip-19 /usr/bin/llvm-strip

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
          local-cache: true
          add-to-path: true

      - name: Initialize Bazel Disk Cache Dir
        run: mkdir -p ~/bazel-disk-cache

      - name: Restore Bazel Disk Cache
        uses: actions/cache/restore@v4
        with:
          path: ~/bazel-disk-cache
          key: bazel-disk-cache-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: |
            bazel-disk-cache-${{ matrix.arch }}-

      - name: Determine workerd version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WORKERD_REF="${{ github.event.inputs.workerd_version }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            WORKERD_REF="${GITHUB_REF#refs/tags/}"
          else
            WORKERD_REF="main"
          fi
          echo "WORKERD_REF=${WORKERD_REF}" >> $GITHUB_ENV
          echo "workerd_ref=${WORKERD_REF}" >> $GITHUB_OUTPUT

      - name: Clone workerd repository
        run: |
          git clone --depth 1 --branch "${WORKERD_REF}" https://github.com/cloudflare/workerd.git workerd-src || \
          git clone --depth 1 https://github.com/cloudflare/workerd.git workerd-src
          cd workerd-src
          WORKERD_COMMIT=$(git rev-parse --short HEAD)
          WORKERD_DATE=$(date -u +%Y%m%d)
          WORKERD_TAG=$(git describe --tags --exact-match 2>/dev/null || true)
          if [ -n "${WORKERD_TAG}" ] && [[ "${WORKERD_TAG#v}" =~ ^[0-9] ]]; then
            WORKERD_VERSION_STR="${WORKERD_TAG#v}"
          else
            WORKERD_VERSION_STR="1.${WORKERD_DATE}.${WORKERD_COMMIT}"
          fi
          echo "WORKERD_VERSION=${WORKERD_VERSION_STR}" >> $GITHUB_ENV
          echo "WORKERD_COMMIT=${WORKERD_COMMIT}" >> $GITHUB_ENV

      - name: Apply Termux Bionic Patches
        run: |
          chmod +x scripts/patch-workerd.sh
          ./scripts/patch-workerd.sh workerd-src

      - name: Configure Android Bionic Toolchain & Bazel
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_TRIPLE: ${{ matrix.target_triple }}
          API_LEVEL: ${{ matrix.api_level }}
        run: |
          chmod +x scripts/setup-toolchain.sh
          ./scripts/setup-toolchain.sh workerd-src

      - name: Build workerd with Bazel for Android/Bionic
        id: bazel-build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_TRIPLE: ${{ matrix.target_triple }}
          API_LEVEL: ${{ matrix.api_level }}
        run: |
          chmod +x scripts/build-workerd.sh
          ./scripts/build-workerd.sh workerd-src

      - name: Save Bazel Disk Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/bazel-disk-cache
          key: bazel-disk-cache-${{ matrix.arch }}-${{ github.run_id }}

      - name: Verify Compiled Binary
        run: |
          BINARY_PATH="workerd-src/bazel-bin/src/workerd/server/workerd"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "Error: Binary not found at $BINARY_PATH"
            exit 1
          fi
          echo "=== File Info ==="
          file "$BINARY_PATH"
          echo "=== ELF Header ==="
          readelf -h "$BINARY_PATH"
          echo "=== Dynamic Section (Shared Libraries & Linker) ==="
          readelf -d "$BINARY_PATH" || true

      - name: Package Termux .deb and Standalone Tarball
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          VERSION: ${{ env.WORKERD_VERSION }}
        run: |
          chmod +x scripts/package-deb.sh
          ./scripts/package-deb.sh workerd-src "${VERSION}" "${TARGET_ARCH}"

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workerd-termux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-termux
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          find all-artifacts -type f -name "*.deb" -exec cp {} release-assets/ \;
          find all-artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          find all-artifacts -type f -name "SHA256SUMS" -exec cat {} + > release-assets/SHA256SUMS || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
